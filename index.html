<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperHackerMan Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #00ff41; font-family: 'Courier New', monospace; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .glow-text { text-shadow: 0 0 5px #00ff41, 0 0 10px #00ff41; }
        .border-glow { border: 1px solid #00ff41; box-shadow: 0 0 5px #00ff41 inset; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4">

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-95 flex items-center justify-center z-50">
        <div class="bg-gray-900 p-8 rounded-none w-full max-w-md border-glow">
            <h2 class="text-2xl font-bold mb-6 text-center glow-text">ROOT ACCESS REQUIRED</h2>
            <input type="text" id="usernameInput" value="SuperHackerMan" 
                class="w-full p-3 bg-black border border-green-700 text-green-400 focus:outline-none focus:border-green-400 mb-4 font-mono"
                onkeypress="handleKeyPress(event)">
            <button onclick="joinChat()" 
                class="w-full bg-green-900 hover:bg-green-800 text-green-100 font-bold py-3 transition duration-200 border border-green-600">
                [ INITIALIZE SESSION ]
            </button>
        </div>
    </div>

    <!-- Main Chat Interface -->
    <div id="chatInterface" class="hidden flex-col w-full max-w-4xl h-[90vh] bg-black rounded-none overflow-hidden border-glow">
        
        <!-- Header -->
        <div class="bg-gray-900 p-4 flex justify-between items-center border-b border-green-800">
            <div class="flex items-center gap-3">
                <span class="text-green-500 animate-pulse">●</span>
                <span id="currentUserDisplay" class="font-semibold text-green-400 font-mono">ROOT: SuperHackerMan</span>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleVoiceCall()" id="voiceCallBtn"
                    class="bg-gray-800 hover:bg-gray-700 text-green-400 px-3 py-1 text-sm border border-green-800">
                    🎤 VOICE_LINK
                </button>
            </div>
        </div>

        <!-- Messages Area -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-2 scrollbar-hide bg-black font-mono text-sm">
            <!-- Messages render here -->
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-gray-900 border-t border-green-800 flex gap-2">
            <span class="text-green-600 py-3">></span>
            <input type="text" id="messageInput" placeholder="Enter command..." 
                class="flex-1 p-3 bg-black border border-green-800 text-green-300 focus:outline-none focus:border-green-400 font-mono"
                onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" 
                class="bg-green-900 hover:bg-green-800 text-white px-6 py-3 font-bold border border-green-600">
                EXECUTE
            </button>
        </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script>
        const SUPABASE_URL = 'https://rncqecctwaghksibcvpu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuY3FlY2N0d2FnaGtzaWJjdnB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNDQ0NDYsImV4cCI6MjEwNzgyMDQ0Nn0.hHZjHv6XsOSIHM2bv1Zfqiiwkni60Yx3SvjpvxKssPw';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = 'SuperHackerMan';
        let localStream = null;
        let peerConnection = null;
        let callChannel = null;
        
        // Local state for moderation
        let bannedUsers = new Set();
        let blockedUsers = new Set();

        const iceServers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function joinChat() {
            const input = document.getElementById('usernameInput').value.trim();
            if (!input) return alert('Identity required.');
            
            currentUser = input;
            document.getElementById('currentUserDisplay').innerText = `ROOT: ${currentUser}`;
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('chatInterface').classList.remove('hidden');
            document.getElementById('chatInterface').classList.add('flex');
            
            fetchMessages();
            setInterval(fetchMessages, 2000);
            initSignaling();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            let text = input.value.trim();
            if (!text) return;

            // Check if current user is banned locally (shouldn't happen if we enforce it, but good safety)
            if (bannedUsers.has(currentUser)) {
                input.value = '';
                addSystemMessage("You are banned from this channel.");
                return;
            }

            // Command Processing
            if (text.startsWith('!')) {
                const parts = text.split(' ');
                const command = parts[0];
                const target = parts[1];

                if (command === '!Ban' && target) {
                    bannedUsers.add(target);
                    await supabaseClient.from('messages').insert([{ 
                        user: 'SYSTEM', 
                        text: `USER_BANNED:${target}`, 
                        type: 'system_command' 
                    }]);
                    addSystemMessage(`Target ${target} has been neutralized.`);
                } 
                else if (command === '!UnBan' && target) {
                    bannedUsers.delete(target);
                    await supabaseClient.from('messages').insert([{ 
                        user: 'SYSTEM', 
                        text: `USER_UNBANNED:${target}`, 
                        type: 'system_command' 
                    }]);
                    addSystemMessage(`Target ${target} privileges restored.`);
                }
                else if (command === '!BlockChatting' && target) {
                    blockedUsers.add(target);
                    addSystemMessage(`Target ${target} communications silenced.`);
                }
                else if (command === '!UnBlockChatting' && target) {
                    blockedUsers.delete(target);
                    addSystemMessage(`Target ${target} communications active.`);
                }
                else if (command === '!ExecuteSQL') {
                    addSystemMessage("ERROR: Direct SQL execution requires SERVICE_ROLE key. Access Denied.");
                }
                else {
                    // Normal message if not a recognized command
                    await sendToSupabase(text);
                }
            } else {
                await sendToSupabase(text);
            }
            
            input.value = '';
        }

        async function sendToSupabase(text) {
            const { error } = await supabaseClient
                .from('messages')
                .insert([{ user: currentUser, text: text, type: 'text' }]);
            
            if (error) console.error('Transmission failed:', error);
        }

        async function fetchMessages() {
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('id', { ascending: true });

            if (error) return;
            renderMessages(data);
        }

        function addSystemMessage(text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'text-red-500 text-xs font-mono my-1';
            div.innerText = `[SYSTEM]: ${text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            
            messages.forEach(msg => {
                // Process System Commands for Global State Sync
                if (msg.type === 'system_command') {
                    const [action, target] = msg.text.split(':');
                    if (action === 'USER_BANNED') bannedUsers.add(target);
                    if (action === 'USER_UNBANNED') bannedUsers.delete(target);
                    return; // Don't render system commands as chat bubbles
                }

                // Check if sender is banned
                if (bannedUsers.has(msg.user)) {
                    msg.text = "Banned User!";
                    msg.user = "UNKNOWN_ENTITY";
                }

                // Check if sender is blocked by me
                if (blockedUsers.has(msg.user)) {
                    return; // Don't render blocked users at all
                }

                const isMe = msg.user === currentUser;
                const div = document.createElement('div');
                div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                
                const userColor = isMe ? 'text-emerald-400' : 'text-blue-400';
                const bgClass = isMe ? 'bg-emerald-900/30 border border-emerald-800' : 'bg-gray-900 border border-gray-800';

                div.innerHTML = `
                    <span class="text-xs ${userColor} mb-1 px-1 font-mono">${msg.user}</span>
                    <div class="max-w-xs md:max-w-md px-4 py-2 rounded-none text-sm ${bgClass} text-gray-200 font-mono">
                        ${msg.text}
                    </div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        // WebRTC Stuff (Same as before)
        function initSignaling() {
            callChannel = supabaseClient.channel('room_voice_call');
            callChannel.on('broadcast', { event: 'signal' }, async ({ payload }) => {
                if (payload.user === currentUser) return;
                if (!peerConnection) createPeerConnection();
                if (payload.sdp) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp));
                    if (payload.sdp.type === 'offer') {
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        callChannel.send({ type: 'broadcast', event: 'signal', payload: { user: currentUser, sdp: peerConnection.localDescription } });
                    }
                } else if (payload.ice) {
                    try { await peerConnection.addIceCandidate(new RTCIceCandidate(payload.ice)); } catch (e) {}
                }
            }).subscribe();
        }

        async function toggleVoiceCall() {
            const btn = document.getElementById('voiceCallBtn');
            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    createPeerConnection();
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    callChannel.send({ type: 'broadcast', event: 'signal', payload: { user: currentUser, sdp: peerConnection.localDescription } });
                    btn.innerText = '🔴 TERMINATE_LINK';
                    btn.classList.replace('bg-gray-800', 'bg-red-900');
                } catch (err) { alert('Microphone access denied.'); }
            } else {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                if (peerConnection) { peerConnection.close(); peerConnection = null; }
                btn.innerText = '🎤 VOICE_LINK';
                btn.classList.replace('bg-red-900', 'bg-gray-800');
            }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(iceServers);
            if (localStream) localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.ontrack = event => { document.getElementById('remoteAudio').srcObject = event.streams[0]; };
            peerConnection.onicecandidate = event => {
                if (event.candidate) callChannel.send({ type: 'broadcast', event: 'signal', payload: { user: currentUser, ice: event.candidate } });
            };
        }
    </script>
</body>
</html>
