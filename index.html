<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a1a1a; color: #e5e5e5; font-family: sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4">

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
            <h2 class="text-2xl font-bold mb-6 text-emerald-400 text-center">Join the Room</h2>
            <input type="text" id="usernameInput" placeholder="Enter your username..." 
                class="w-full p-3 bg-gray-900 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-emerald-500 mb-4"
                onkeypress="handleKeyPress(event)">
            <button onclick="joinChat()" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition duration-200">
                Enter Chat
            </button>
        </div>
    </div>

    <!-- Main Chat Interface -->
    <div id="chatInterface" class="hidden flex-col w-full max-w-4xl h-[90vh] bg-gray-800 rounded-xl shadow-2xl overflow-hidden border border-gray-700">
        
        <!-- Header -->
        <div class="bg-gray-900 p-4 flex justify-between items-center border-b border-gray-700">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                <span id="currentUserDisplay" class="font-semibold text-gray-200">User: ...</span>
            </div>
            <button id="voiceCallBtn" onclick="toggleVoiceCall()" 
                class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition duration-200 flex items-center gap-2">
                🎤 Start Voice Call
            </button>
        </div>

        <!-- Messages Area -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-hide bg-gray-800">
            <!-- Messages will appear here -->
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-gray-900 border-t border-gray-700 flex gap-3">
            <input type="text" id="messageInput" placeholder="Type a message..." 
                class="flex-1 p-3 bg-gray-800 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-emerald-500"
                onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" 
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-lg font-bold transition duration-200">
                Send
            </button>
        </div>
    </div>

    <!-- Hidden Audio Element for WebRTC -->
    <audio id="remoteAudio" autoplay></audio>

    <script>
        const SUPABASE_URL = 'https://rncqecctwaghksibcvpu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuY3FlY2N0d2FnaGtzaWJjdnB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNDQ0NDYsImV4cCI6MjEwNzgyMDQ0Nn0.hHZjHv6XsOSIHM2bv1Zfqiiwkni60Yx3SvjpvxKssPw';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = '';
        let localStream = null;
        let peerConnection = null;
        let callChannel = null;
        let messageInterval = null;

        const iceServers = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        function joinChat() {
            const input = document.getElementById('usernameInput').value.trim();
            if (!input) {
                alert('Please enter your name first!');
                return;
            }
            currentUser = input;
            document.getElementById('currentUserDisplay').innerText = `User: ${currentUser}`;
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('chatInterface').classList.remove('hidden');
            document.getElementById('chatInterface').classList.add('flex');
            
            fetchMessages();
            messageInterval = setInterval(fetchMessages, 2000);
            initSignaling();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const { error } = await supabaseClient
                .from('messages')
                .insert([{ user: currentUser, text: text, type: 'text' }]);

            if (error) {
                console.error('Error sending message:', error);
                alert('Error sending message: ' + error.message);
            } else {
                input.value = '';
                fetchMessages();
            }
        }

        async function fetchMessages() {
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                console.error('Error fetching messages:', error);
                return;
            }

            renderMessages(data);
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            const isScrolledToBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 50;
            
            // Simple diffing could be better, but for now we redraw
            container.innerHTML = '';
            messages.forEach(msg => {
                const isMe = msg.user === currentUser;
                const div = document.createElement('div');
                div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                div.innerHTML = `
                    <span class="text-xs text-gray-400 mb-1 px-1">${msg.user}</span>
                    <div class="max-w-xs md:max-w-md px-4 py-2 rounded-2xl text-sm ${isMe ? 'bg-emerald-600 text-white rounded-bl-none' : 'bg-gray-700 text-gray-200 rounded-br-none'}">
                        ${msg.text}
                    </div>
                `;
                container.appendChild(div);
            });

            if (isScrolledToBottom) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function initSignaling() {
            callChannel = supabaseClient.channel('room_voice_call');

            callChannel
                .on('broadcast', { event: 'signal' }, async ({ payload }) => {
                    if (payload.user === currentUser) return;

                    if (!peerConnection) createPeerConnection();

                    if (payload.sdp) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp));
                        if (payload.sdp.type === 'offer') {
                            const answer = await peerConnection.createAnswer();
                            await peerConnection.setLocalDescription(answer);
                            callChannel.send({
                                type: 'broadcast',
                                event: 'signal',
                                payload: { user: currentUser, sdp: peerConnection.localDescription }
                            });
                        }
                    } else if (payload.ice) {
                        try {
                            await peerConnection.addIceCandidate(new RTCIceCandidate(payload.ice));
                        } catch (e) {
                            console.error('Error adding received ice candidate', e);
                        }
                    }
                })
                .subscribe();
        }

        async function toggleVoiceCall() {
            const btn = document.getElementById('voiceCallBtn');
            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    createPeerConnection();

                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    callChannel.send({
                        type: 'broadcast',
                        event: 'signal',
                        payload: { user: currentUser, sdp: peerConnection.localDescription }
                    });

                    btn.innerText = '🔴 End Voice Call';
                    btn.classList.replace('bg-blue-600', 'bg-red-600');
                    btn.classList.replace('hover:bg-blue-500', 'hover:bg-red-500');
                } catch (err) {
                    alert('Could not access microphone.');
                    console.error(err);
                }
            } else {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
                btn.innerText = '🎤 Start Voice Call';
                btn.classList.replace('bg-red-600', 'bg-blue-600');
                btn.classList.replace('hover:bg-red-500', 'hover:bg-blue-500');
            }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(iceServers);

            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            peerConnection.ontrack = event => {
                const remoteAudio = document.getElementById('remoteAudio');
                remoteAudio.srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    callChannel.send({
                        type: 'broadcast',
                        event: 'signal',
                        payload: { user: currentUser, ice: event.candidate }
                    });
                }
            };
        }
    </script>
</body>
</html>
