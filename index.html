<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperHackerMan Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #00ff41; font-family: 'Courier New', monospace; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .glow-text { text-shadow: 0 0 5px #00ff41, 0 0 10px #00ff41; }
        .border-glow { border: 1px solid #00ff41; box-shadow: 0 0 5px #00ff41 inset; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4">

    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-95 flex items-center justify-center z-50">
        <div class="bg-gray-900 p-8 rounded-none w-full max-w-md border-glow">
            <h2 class="text-2xl font-bold mb-6 text-center glow-text">ROOT ACCESS REQUIRED</h2>
            <input type="text" id="usernameInput" value="SuperHackerMan" 
                class="w-full p-3 bg-black border border-green-700 text-green-400 focus:outline-none focus:border-green-400 mb-4 font-mono"
                onkeypress="handleKeyPress(event)">
            <button onclick="joinChat()" 
                class="w-full bg-green-900 hover:bg-green-800 text-green-100 font-bold py-3 transition duration-200 border border-green-600">
                [ INITIALIZE SESSION ]
            </button>
        </div>
    </div>

    <div id="chatInterface" class="hidden flex-col w-full max-w-4xl h-[90vh] bg-black rounded-none overflow-hidden border-glow">
        <div class="bg-gray-900 p-4 flex justify-between items-center border-b border-green-800">
            <div class="flex items-center gap-3">
                <span class="text-green-500 animate-pulse">●</span>
                <span id="currentUserDisplay" class="font-semibold text-green-400 font-mono">ROOT: SuperHackerMan</span>
            </div>
            <button onclick="toggleVoiceCall()" id="voiceCallBtn"
                class="bg-gray-800 hover:bg-gray-700 text-green-400 px-3 py-1 text-sm border border-green-800">
                🎤 VOICE_LINK
            </button>
        </div>

        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-2 scrollbar-hide bg-black font-mono text-sm"></div>

        <div class="p-4 bg-gray-900 border-t border-green-800 flex gap-2">
            <span class="text-green-600 py-3">></span>
            <input type="text" id="messageInput" placeholder="Enter command..." 
                class="flex-1 p-3 bg-black border border-green-800 text-green-300 focus:outline-none focus:border-green-400 font-mono"
                onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" 
                class="bg-green-900 hover:bg-green-800 text-white px-6 py-3 font-bold border border-green-600">
                EXECUTE
            </button>
        </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script>
        const SUPABASE_URL = 'https://rncqecctwaghksibcvpu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuY3FlY2N0d2FnaGtzaWJjdnB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNDQ0NDYsImV4cCI6MjEwNzgyMDQ0Nn0.hHZjHv6XsOSIHM2bv1Zfqiiwkni60Yx3SvjpvxKssPw';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = 'SuperHackerMan';
        let localStream = null;
        let peerConnection = null;
        let callChannel = null;
        let moderationCache = {};
        let messagesCache = [];
        let renderScheduled = false;

        const iceServers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function joinChat() {
            const input = document.getElementById('usernameInput').value.trim();
            if (!input) return alert('Identity required.');
            
            currentUser = input;
            document.getElementById('currentUserDisplay').innerText = `ROOT: ${currentUser}`;
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('chatInterface').classList.remove('hidden');
            document.getElementById('chatInterface').classList.add('flex');
            
            initRealtime();
            fetchInitialData();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function fetchInitialData() {
            const [modResult, msgResult] = await Promise.all([
                supabaseClient.from('moderation').select('target_user, action, active'),
                supabaseClient.from('messages').select('*').order('id', { ascending: true })
            ]);
            
            if (modResult.data) {
                modResult.data.forEach(m => {
                    if (m.active) moderationCache[m.target_user] = m.action;
                });
            }

            if (msgResult.data) {
                messagesCache = msgResult.data;
                scheduleRender();
            }
        }

        function initRealtime() {
            supabaseClient
                .channel('messages_channel')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                    messagesCache.push(payload.new);
                    scheduleRender();
                })
                .subscribe();

            supabaseClient
                .channel('moderation_channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'moderation' }, (payload) => {
                    if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
                        if (payload.new.active) {
                            moderationCache[payload.new.target_user] = payload.new.action;
                        } else {
                            delete moderationCache[payload.new.target_user];
                        }
                    } else if (payload.eventType === 'DELETE') {
                        delete moderationCache[payload.old.target_user];
                    }
                    scheduleRender();
                })
                .subscribe();

            initSignaling();
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            let text = input.value.trim();
            if (!text) return;

            if (text.startsWith('!')) {
                const parts = text.split(' ');
                const command = parts[0];
                const target = parts[1];

                if (target && (command === '!Ban' || command === '!UnBan' || command === '!BlockChatting' || command === '!UnBlockChatting')) {
                    await updateModeration(target, command);
                    addSystemMessage(`Command executed: ${command} ${target}`);
                } else {
                    addSystemMessage("Invalid syntax. Use: !Ban [user], !BlockChatting [user], etc.");
                }
            } else {
                if (moderationCache[currentUser] === 'ban') {
                    addSystemMessage("TRANSMISSION DENIED: You are banned.");
                    input.value = '';
                    return;
                }
                
                await supabaseClient.from('messages').insert([{ user: currentUser, text: text, type: 'text' }]);
            }
            
            input.value = '';
        }

        async function updateModeration(target, command) {
            let action, active;
            if (command === '!Ban') { action = 'ban'; active = true; }
            else if (command === '!UnBan') { action = 'ban'; active = false; }
            else if (command === '!BlockChatting') { action = 'block'; active = true; }
            else if (command === '!UnBlockChatting') { action = 'block'; active = false; }

            await supabaseClient.from('moderation').upsert(
                { target_user: target, action: action, active: active, moderator: currentUser },
                { onConflict: 'target_user' }
            );
        }

        function addSystemMessage(text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'text-red-500 text-xs font-mono my-1';
            div.innerText = `[SYSTEM]: ${text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function scheduleRender() {
            if (!renderScheduled) {
                renderScheduled = true;
                requestAnimationFrame(() => {
                    renderMessages();
                    renderScheduled = false;
                });
            }
        }

        function renderMessages() {
            const container = document.getElementById('chatMessages');
            const isScrolledToBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 50;
            
            const fragment = document.createDocumentFragment();
            
            messagesCache.forEach(msg => {
                const senderStatus = moderationCache[msg.user];
                
                let displayUser = msg.user;
                let displayText = msg.text;
                
                if (senderStatus === 'ban') {
                    displayUser = "UNKNOWN_ENTITY";
                    displayText = "Banned User!";
                }

                if (senderStatus === 'block') {
                    return;
                }

                const isMe = displayUser === currentUser;
                const div = document.createElement('div');
                div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                
                const userColor = isMe ? 'text-emerald-400' : 'text-blue-400';
                const bgClass = isMe ? 'bg-emerald-900/30 border border-emerald-800' : 'bg-gray-900 border border-gray-800';

                div.innerHTML = `
                    <span class="text-xs ${userColor} mb-1 px-1 font-mono">${displayUser}</span>
                    <div class="max-w-xs md:max-w-md px-4 py-2 rounded-none text-sm ${bgClass} text-gray-200 font-mono">
                        ${displayText}
                    </div>
                `;
                fragment.appendChild(div);
            });

            container.innerHTML = '';
            container.appendChild(fragment);

            if (isScrolledToBottom) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function initSignaling() {
            callChannel = supabaseClient.channel('room_voice_call');
            callChannel.on('broadcast', { event: 'signal' }, async ({ payload }) => {
                if (payload.user === currentUser) return;
                if (!peerConnection) createPeerConnection();
                if (payload.sdp) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp));
                    if (payload.sdp.type === 'offer') {
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        callChannel.send({ type: 'broadcast', event: 'signal', payload: { user: currentUser, sdp: peerConnection.localDescription } });
                    }
                } else if (payload.ice) {
                    try { await peerConnection.addIceCandidate(new RTCIceCandidate(payload.ice)); } catch (e) {}
                }
            }).subscribe();
        }

        async function toggleVoiceCall() {
            const btn = document.getElementById('voiceCallBtn');
            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    createPeerConnection();
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    callChannel.send({ type: 'broadcast', event: 'signal', payload: { user: currentUser, sdp: peerConnection.localDescription } });
                    btn.innerText = '🔴 TERMINATE_LINK';
                    btn.classList.replace('bg-gray-800', 'bg-red-900');
                } catch (err) { alert('Microphone access denied.'); }
            } else {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                if (peerConnection) { peerConnection.close(); peerConnection = null; }
                btn.innerText = '🎤 VOICE_LINK';
                btn.classList.replace('bg-red-900', 'bg-gray-800');
            }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(iceServers);
            if (localStream) localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.ontrack = event => { document.getElementById('remoteAudio').srcObject = event.streams[0]; };
            peerConnection.onicecandidate = event => {
                if (event.candidate) callChannel.send({ type: 'broadcast', event: 'signal', payload: { user: currentUser, ice: event.candidate } });
            };
        }
    </script>
</body>
</html>
